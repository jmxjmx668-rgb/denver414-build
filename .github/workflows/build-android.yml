name: build-android-binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install NDK
        run: |
          curl -fLSs -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r26d" >> $GITHUB_ENV

      - name: Fetch upstream exploit sources
        run: git clone --depth=1 https://github.com/JoinChang/ghostlock-oneplus exploit

      - uses: actions/checkout@v4
        with:
          path: overlay-repo

      - name: Apply CDY 4.14 adaptation overlay
        run: |
          cp -rv overlay-repo/overlay/. exploit/
          grep -n "cdy414" exploit/src/devices/offsets.h | head -3
          grep -n "SELINUX_ENFORCING_OFF == 0" exploit/src/core/main.c | head -2

      - name: Build
        run: |
          cd exploit
          make all -j$(nproc) 2>&1 | tee build.log
          test -f ghostlock && echo "BUILD OK" || { echo "BUILD FAILED"; tail -60 build.log; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ghostlock-cdy414
          path: |
            exploit/ghostlock
            exploit/build.log
          if-no-files-found: error
